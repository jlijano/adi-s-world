name: Adi's World Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deploy files
        run: node scripts/validate-deploy.mjs

      - name: Audit playable game flows
        run: node scripts/audit-game-flows.mjs

      - name: Audit responsive layouts
        run: node scripts/audit-responsive-layout.mjs

      - name: Run smoke tests
        run: node scripts/smoke-test.mjs
