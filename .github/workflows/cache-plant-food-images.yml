name: Cache Plant Food Images

on:
  push:
    paths:
      - ".github/workflows/cache-plant-food-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified Wikimedia Commons images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/discovery/plant-foods

          download_food() {
            local local_name="$1"
            local commons_name="$2"
            local encoded
            encoded="$(python -c 'import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe=""))' "$commons_name")"
            echo "Downloading $commons_name -> $local_name"
            curl -L --fail --retry 3 --retry-delay 2 \
              "https://commons.wikimedia.org/wiki/Special:Redirect/file/${encoded}?width=900" \
              -o "assets/discovery/plant-foods/${local_name}.jpg"
          }

          download_food "mango" "Green Mango fruit.jpg"
          download_food "banana" "Banana fruit.jpeg"
          download_food "pineapple" "Pineapple fruit.jpg"
          download_food "carrot" "Carrot vegetable on white background.jpg"
          download_food "broccoli" "Broccoli vegetable.jpg"
          download_food "papaya" "Papaya fruit.jpg"
          download_food "guava" "Guavafruit.jpg"
          download_food "coconut" "Coconut Fruit.jpg"
          download_food "eggplant" "Philippine Eggplant.jpg"
          download_food "squash" "- Squash -.jpg"
          download_food "cucumber" "Photo of Cucumber.jpg"
          download_food "chico" "Sapodilla fruit image.jpg"
          download_food "calamansi" "Calamansi fruits 1.jpg"
          download_food "lanzones" "Lanzones fruits - Mindanao, Philippines.jpg"
          download_food "jackfruit" "Jackfruit.jpg"
          download_food "ampalaya" "Bittermelonfruit.jpg"
          download_food "malunggay" "Malunggay leaves.jpg"
          download_food "patola" "Luffa Sponge Gourd.jpg"
          download_food "kangkong" "Water Spinach - Chinese Convolvulus - Kangkong.jpg"
          download_food "string-beans" "String beans.jpg"

          for f in assets/discovery/plant-foods/*.jpg; do
            test -s "$f"
          done

      - name: Commit cached assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/discovery/plant-foods
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Cache accurate Plant Food Sort images"
          git push origin HEAD:main
